name: Update Fußball Kalender

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # ⭐ DAS IST DER FIX

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4 pytz

      - run: python generate_ics.py

      - run: |
          git config user.name "calendar-bot"
          git config user.email "bot@github.com"
          git add spiele.ics
          git commit -m "update calendar" || echo "no changes"
          git push
